<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Підробіток Офіціантом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f4f4f5); color: var(--tg-theme-text-color, #222);
      margin: 0; padding: 16px; box-sizing: border-box; }
    .card { background: var(--tg-theme-secondary-bg-color, #fff); border-radius: 12px; padding: 16px;
      margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .card.admin { border: 2px dashed var(--tg-theme-button-color, #0088cc); }
    h2, h3, h4 { margin-top: 0; }
    p { margin: 6px 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px;
      box-sizing: border-box; font-size: 16px; background: #fff; color: #222; }
    button { width: 100%; background: var(--tg-theme-button-color, #0088cc); color: var(--tg-theme-button-text-color, #fff);
      border: 0; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 12px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .danger { background: #ef4444; color: #fff; }
    .ok { background: #10b981; color: #fff; }
    .hidden { display: none; }
    .tag, .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; }
    .tag { background: #e0f2fe; color: #0369a1; }
    .wait { background: #fef3c7; color: #d97706; }
    .yes { background: #d1fae5; color: #059669; }
    .no { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>

  <div id="msg" class="card hidden"></div>

  <!-- АНКЕТА (лише працівники) -->
  <div id="reg" class="card hidden">
    <h2>Анкета офіціанта</h2>
    <form id="profileForm">
      <label for="fullName">Ім'я та Прізвище</label>
      <input type="text" id="fullName" placeholder="Олександр Іванов" maxlength="80" required>
      <label for="phone">Номер телефону</label>
      <input type="tel" id="phone" placeholder="+48 123 456 789" maxlength="30" required>
      <label for="city">Місто</label>
      <select id="city" required>
        <option value="" disabled selected>Оберіть місто</option>
        <option>Варшава</option><option>Краків</option><option>Вроцлав</option><option>Гданськ</option>
      </select>
      <button type="submit">Зберегти та продовжити</button>
    </form>
  </div>

  <div id="app" class="hidden">

    <!-- ПАНЕЛЬ АДМІНІСТРАТОРА -->
    <div id="admin" class="hidden">
      <div class="card admin">
        <h3>⚙️ Панель адміністратора</h3>
        <form id="addShiftForm">
          <h4>Додати нову зміну</h4>
          <label>Ресторан</label>
          <input type="text" id="resName" placeholder="Grand Cafe" maxlength="80" required>
          <label>Місто</label>
          <select id="resCity" required>
            <option>Варшава</option><option>Краків</option><option>Вроцлав</option><option>Гданськ</option>
          </select>
          <label>Дата та час</label>
          <input type="text" id="resTime" placeholder="Завтра, 14:00 - 22:00" maxlength="80" required>
          <label>Оплата</label>
          <input type="text" id="resPay" placeholder="35 злотих/год" maxlength="80" required>
          <button type="submit">Створити зміну</button>
        </form>
      </div>
      <h3>📋 Заявки працівників</h3>
      <div id="adminBookings"></div>
    </div>

    <h3>Доступні підробітки</h3>
    <div id="shifts"></div>

    <div id="mine" class="hidden">
      <h3 style="margin-top:24px">Мої заявки</h3>
      <div id="myBookings"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API_URL = "https://script.google.com/macros/s/AKfycbyZ4rDoWnp0BSr4Slz7Axme6V0od1LF9-9RkJqCxjWknf-q3UQB9o5y7W_g69XxPt4y/exec";

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const LS_KEY = 'kelner_user_' + (tg.initDataUnsafe?.user?.id ?? 'guest');
    const statusCls = s => ({ 'Підтверджено': 'yes', 'Відхилено': 'no' }[s] || 'wait');
    const profile = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } };

    let state = { role: null, shifts: [], bookings: [] };
    let busy = false;

    async function api(action, payload = {}) {
      const qs = new URLSearchParams({ action, auth: tg.initData, p: JSON.stringify(payload) });
      const res = await fetch(API_URL + '?' + qs);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      return json;
    }

    async function load() {
      try { state = await api('getData'); render(); }
      catch (e) { console.error(e); if (!state.role) { $('msg').textContent = '⚠️ ' + e.message; $('msg').classList.remove('hidden'); } }
    }

    function render() {
      const admin = state.role === 'admin';
      $('msg').classList.add('hidden');
      if (!admin && !profile()) { $('reg').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
      $('reg').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('admin').classList.toggle('hidden', !admin);
      $('mine').classList.toggle('hidden', admin);

      const taken = new Set(state.bookings.filter(b => b.status !== 'Відхилено').map(b => b.shiftId));
      $('shifts').innerHTML = state.shifts.length ? state.shifts.map(s => `
        <div class="card">
          <h4>Ресторан "${esc(s.name)}"</h4>
          <p>📍 ${esc(s.city)}</p><p>⏱️ ${esc(s.time)}</p>
          <span class="tag">${esc(s.pay)}</span>
          ${admin ? `<button class="danger" data-act="del" data-id="${esc(s.id)}">Видалити зміну</button>`
            : taken.has(s.id) ? `<button disabled>Заявку подано</button>`
            : `<button data-act="book" data-id="${esc(s.id)}">Забронювати зміну</button>`}
        </div>`).join('') : '<p>Наразі немає доступних змін.</p>';

      if (admin) {
        $('adminBookings').innerHTML = state.bookings.length ? state.bookings.slice().reverse().map(b => `
          <div class="card">
            <p><b>Зміна:</b> ${esc(b.shiftName)}</p>
            <p>👤 <b>Працівник:</b> ${esc(b.fullName)} (${esc(b.username)})</p>
            <p>📞 <b>Телефон:</b> ${esc(b.phone)}</p>
            <p>Статус: <span class="badge ${statusCls(b.status)}">${esc(b.status)}</span></p>
            ${b.status === 'Очікує' ? `
              <button class="ok" data-act="st" data-id="${esc(b.id)}" data-s="Підтверджено">Підтвердити</button>
              <button class="danger" data-act="st" data-id="${esc(b.id)}" data-s="Відхилено">Відхилити</button>` : ''}
          </div>`).join('') : '<p>Поки немає жодної заявки.</p>';
      } else {
        $('myBookings').innerHTML = state.bookings.length ? state.bookings.slice().reverse().map(b => `
          <div class="card">
            <h4>${esc(b.shiftName)}</h4>
            <p>Статус заявки: <span class="badge ${statusCls(b.status)}">${esc(b.status)}</span></p>
          </div>`).join('') : '<p>Ви ще не бронювали зміни.</p>';
      }
    }

    $('profileForm').addEventListener('submit', e => {
      e.preventDefault();
      localStorage.setItem(LS_KEY, JSON.stringify({
        fullName: $('fullName').value.trim(), phone: $('phone').value.trim(), city: $('city').value
      }));
      try { tg.requestWriteAccess && tg.requestWriteAccess(); } catch {}
      render();
    });

    $('addShiftForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        state = await api('addShift', {
          name: $('resName').value, city: $('resCity').value, time: $('resTime').value, pay: $('resPay').value
        });
        e.target.reset();
        render();
        alert('Зміну додано!');
      } catch (err) { alert('Помилка: ' + err.message); }
      finally { busy = false; }
    });

    document.addEventListener('click', async e => {
      const btn = e.target.closest('[data-act]');
      if (!btn || busy) return;
      const { act, id, s } = btn.dataset;
      busy = true;
      btn.disabled = true;
      try {
        if (act === 'book') {
          const p = profile();
          if (!p) throw new Error('Спочатку заповніть анкету');
          state = await api('bookShift', { shiftId: id, fullName: p.fullName, phone: p.phone });
          render();
          alert('Заявку надіслано адміністратору!');
        } else if (act === 'del') {
          if (confirm('Видалити цю зміну?')) { state = await api('deleteShift', { id }); render(); }
        } else if (act === 'st') {
          state = await api('updateStatus', { id, status: s });
          render();
          alert(state.notified ? `Статус: ${s}. Працівника сповіщено.`
            : `Статус: ${s}. ⚠️ Сповіщення не доставлено — працівник ще не запускав бота (/start).`);
        }
      } catch (err) { alert('Помилка: ' + err.message); load(); }
      finally { busy = false; btn.disabled = false; }
    });

    setInterval(() => { if (!document.hidden && !busy && state.role) load(); }, 15000);

    if (!tg.initData) { $('msg').textContent = '⚠️ Відкрийте додаток через Telegram-бота.'; $('msg').classList.remove('hidden'); }
    else load();
  </script>
</body>
</html>
