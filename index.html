<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Підробіток Офіціантом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #222);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2, h3 { margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background: #fff;
    }
    button {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
    }
    .btn-danger {
      background-color: #ef4444;
      margin-top: 8px;
    }
    .hidden { display: none; }
    .shift-tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- СЕКЦІЯ РЕЄСТРАЦІЇ -->
  <div id="registration-form" class="card">
    <h2>Анкета офіціанта</h2>
    <form id="profileForm">
      <label for="fullName">Ім'я та Прізвище</label>
      <input type="text" id="fullName" placeholder="Олександр Іванов" required>

      <label for="phone">Номер телефону</label>
      <input type="tel" id="phone" placeholder="+48 123 456 789" required>

      <label for="city">Місто</label>
      <select id="city" required>
        <option value="" disabled selected>Оберіть місто</option>
        <option value="Варшава">Варшава</option>
        <option value="Краків">Краків</option>
        <option value="Вроцлав">Вроцлав</option>
        <option value="Гданськ">Гданськ</option>
      </select>

      <button type="submit" id="submitBtn">Зберегти та дивитися зміни</button>
    </form>
  </div>

  <!-- СЕКЦІЯ ЗМІН -->
  <div id="shifts-list" class="card hidden">
    <h3>Доступні підробітки</h3>

    <!-- Панель адміністратора (видно лише вам) -->
    <div id="admin-panel" class="card hidden" style="border: 2px dashed #0088cc; background: #f0f9ff;">
      <h3>⚙️ Панель адміністратора</h3>
      <form id="addShiftForm">
        <label for="resName">Назва ресторану</label>
        <input type="text" id="resName" placeholder="Grand Cafe" required>

        <label for="resCity">Місто</label>
        <select id="resCity" required>
          <option value="Варшава">Варшава</option>
          <option value="Краків">Краків</option>
          <option value="Вроцлав">Вроцлав</option>
          <option value="Гданськ">Гданськ</option>
        </select>

        <label for="resTime">Час та дата</label>
        <input type="text" id="resTime" placeholder="Завтра, 14:00 - 22:00" required>

        <label for="resPay">Оплата</label>
        <input type="text" id="resPay" placeholder="35 злотих/год" required>

        <button type="submit">Додати зміну</button>
      </form>
    </div>
    
    <!-- Контейнер для списку змін -->
    <div id="shifts-container"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const BOT_TOKEN = "8971102051:AAGaWLdVNd-a07ZUk3kKJlxaNqqiLSG2TKs";
    const ADMIN_CHAT_ID = "1537392635";

    const tgUser = tg.initDataUnsafe?.user;
    const tgUserId = tgUser ? String(tgUser.id) : 'guest';
    const tgUsername = tgUser ? `@${tgUser.username}` : 'немає юзернейму';

    const regForm = document.getElementById('registration-form');
    const shiftsList = document.getElementById('shifts-list');
    const adminPanel = document.getElementById('admin-panel');
    const form = document.getElementById('profileForm');
    const addShiftForm = document.getElementById('addShiftForm');
    const shiftsContainer = document.getElementById('shifts-container');

    // Початкові зміни (якщо ще нічого не додано)
    const defaultShifts = [
      { id: 1, name: "Grand Cafe", city: "Варшава", time: "Завтра, 14:00 - 22:00 (8 годин)", pay: "35 злотих/год" }
    ];

    function getShifts() {
      const stored = localStorage.getItem('kelner_shifts');
      return stored ? JSON.parse(stored) : defaultShifts;
    }

    function renderShifts() {
      const shifts = getShifts();
      shiftsContainer.innerHTML = '';

      shifts.forEach(shift => {
        const shiftCard = document.createElement('div');
        shiftCard.className = 'card';
        shiftCard.style.border = '1px solid #eee';
        shiftCard.innerHTML = `
          <h4>Ресторан "${shift.name}"</h4>
          <p>📍 ${shift.city}</p>
          <p>⏱️ ${shift.time}</p>
          <span class="shift-tag">${shift.pay}</span>
          <button onclick="takeShift('${shift.name}')">Забронювати зміну</button>
          ${tgUserId === ADMIN_CHAT_ID ? `<button class="btn-danger" onclick="deleteShift(${shift.id})">Видалити зміну</button>` : ''}
        `;
        shiftsContainer.appendChild(shiftCard);
      });
    }

    // Перевірка реєстрації
    const savedUser = localStorage.getItem('kelner_user_' + tgUserId);
    if (savedUser) {
      regForm.classList.add('hidden');
      shiftsList.classList.remove('hidden');
      renderShifts();
    }

    // Показуємо панель адміна, якщо це ваш ID
    if (tgUserId === ADMIN_CHAT_ID) {
      adminPanel.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Надсилання...";
      btn.disabled = true;

      const fullName = document.getElementById('fullName').value;
      const phone = document.getElementById('phone').value;
      const city = document.getElementById('city').value;

      const userData = { fullName, phone, city, tgUsername };
      const text = `📥 **Нова анкета офіціанта!**\n\n👤 **ПІБ:** ${fullName}\n📞 **Телефон:** ${phone}\n🏙️ **Місто:** ${city}\n💬 **Telegram:** ${tgUsername}`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: text, parse_mode: 'Markdown' })
        });

        localStorage.setItem('kelner_user_' + tgUserId, JSON.stringify(userData));
        regForm.classList.add('hidden');
        shiftsList.classList.remove('hidden');
        renderShifts();
      } catch (error) {
        alert("Помилка надсилання. Спробуйте ще раз.");
        btn.innerText = "Зберегти та дивитися зміни";
        btn.disabled = false;
      }
    });

    // Додавання нової зміни адміністратором
    addShiftForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('resName').value;
      const city = document.getElementById('resCity').value;
      const time = document.getElementById('resTime').value;
      const pay = document.getElementById('resPay').value;

      const shifts = getShifts();
      const newShift = { id: Date.now(), name, city, time, pay };
      shifts.push(newShift);
      
      localStorage.setItem('kelner_shifts', JSON.stringify(shifts));
      addShiftForm.reset();
      renderShifts();
      alert("Зміну успішно додано!");
    });

    function deleteShift(id) {
      let shifts = getShifts();
      shifts = shifts.filter(s => s.id !== id);
      localStorage.setItem('kelner_shifts', JSON.stringify(shifts));
      renderShifts();
    }

    function takeShift(restaurant) {
      alert(`Ви відгукнулися на зміну в ${restaurant}! Менеджер зв'яжеться з вами.`);
    }
  </script>
</body>
</html>
