<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Підробіток Офіціантом</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #222);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2, h3 { margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background: #fff;
    }
    button {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }
    .btn-danger { background-color: #ef4444; }
    .btn-success { background-color: #10b981; }
    .hidden { display: none; }
    .shift-tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
    }
    .status-pending { background: #fef3c7; color: #d97706; }
    .status-confirmed { background: #d1fae5; color: #059669; }
    .status-rejected { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>

  <!-- АНКЕТА РЕЄСТРАЦІЇ -->
  <div id="registration-form" class="card">
    <h2>Анкета офіціанта</h2>
    <form id="profileForm">
      <label for="fullName">Ім'я та Прізвище</label>
      <input type="text" id="fullName" placeholder="Олександр Іванов" required>

      <label for="phone">Номер телефону</label>
      <input type="tel" id="phone" placeholder="+48 123 456 789" required>

      <label for="city">Місто</label>
      <select id="city" required>
        <option value="" disabled selected>Оберіть місто</option>
        <option value="Варшава">Варшава</option>
        <option value="Краків">Краків</option>
        <option value="Вроцлав">Вроцлав</option>
        <option value="Гданськ">Гданськ</option>
      </select>

      <button type="submit" id="submitBtn">Зберегти та продовжити</button>
    </form>
  </div>

  <!-- ОСНОВНИЙ ДОДАТОК -->
  <div id="app-content" class="hidden">

    <!-- ПАНЕЛЬ АДМІНІСТРАТОРА -->
    <div id="admin-panel" class="card hidden" style="border: 2px dashed #0088cc; background: #f0f9ff;">
      <h3>⚙️ Панель адміністратора</h3>
      
      <form id="addShiftForm">
        <h4>Додати нову зміну</h4>
        <label>Ресторан</label>
        <input type="text" id="resName" placeholder="Grand Cafe" required>
        <label>Місто</label>
        <select id="resCity" required>
          <option value="Варшава">Варшава</option>
          <option value="Краків">Краків</option>
          <option value="Вроцлав">Вроцлав</option>
          <option value="Гданськ">Гданськ</option>
        </select>
        <label>Час та дата</label>
        <input type="text" id="resTime" placeholder="Завтра, 14:00 - 22:00" required>
        <label>Оплата</label>
        <input type="text" id="resPay" placeholder="35 злотих/год" required>
        <button type="submit">Створити зміну</button>
      </form>

      <h4 style="margin-top: 24px;">📋 Заявки працівників</h4>
      <div id="admin-bookings-container">Завантаження заявок...</div>
    </div>

    <!-- КАТАЛОГ ЗМІН ДЛЯ ПРАЦІВНИКІВ -->
    <div id="employee-view">
      <h3>Доступні підробітки</h3>
      <div id="shifts-container">Завантаження змін...</div>

      <h3 style="margin-top: 24px;">Мої заявки</h3>
      <div id="my-bookings-container">У вас немає активних заявок.</div>
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const BOT_TOKEN = "8971102051:AAGaWLdVNd-a07ZUk3kKJlxaNqqiLSG2TKs";
    const ADMIN_CHAT_ID = "1537392635";
    
    // ВСТАВТЕ СЮДИ ВАШ АКТУАЛЬНИЙ URL ВІД GOOGLE APPS SCRIPT:
    const API_URL = "ТУТ_ВСТАВТЕ_ВАШ_URL_ВІД_GOOGLE";

    const tgUser = tg.initDataUnsafe?.user;
    const tgUserId = tgUser ? String(tgUser.id) : 'guest';
    const tgUsername = tgUser ? `@${tgUser.username}` : 'немає юзернейму';

    const regForm = document.getElementById('registration-form');
    const appContent = document.getElementById('app-content');
    const adminPanel = document.getElementById('admin-panel');
    const profileForm = document.getElementById('profileForm');
    const addShiftForm = document.getElementById('addShiftForm');
    
    const shiftsContainer = document.getElementById('shifts-container');
    const myBookingsContainer = document.getElementById('my-bookings-container');
    const adminBookingsContainer = document.getElementById('admin-bookings-container');

    let globalData = { shifts: [], bookings: [] };

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        globalData = await response.json();
        renderUI();
      } catch (err) {
        console.error("Помилка завантаження даних", err);
      }
    }

    const savedUser = localStorage.getItem('kelner_user_' + tgUserId);
    if (savedUser || tgUserId === ADMIN_CHAT_ID) {
      regForm.classList.add('hidden');
      appContent.classList.remove('hidden');
      if (tgUserId === ADMIN_CHAT_ID) {
        adminPanel.classList.remove('hidden');
      }
      loadData();
    }

    profileForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value;
      const phone = document.getElementById('phone').value;
      const city = document.getElementById('city').value;

      const userData = { fullName, phone, city, tgUsername };
      localStorage.setItem('kelner_user_' + tgUserId, JSON.stringify(userData));

      regForm.classList.add('hidden');
      appContent.classList.remove('hidden');
      if (tgUserId === ADMIN_CHAT_ID) {
        adminPanel.classList.remove('hidden');
      }
      loadData();
    });

    function renderUI() {
      shiftsContainer.innerHTML = '';
      if (globalData.shifts.length === 0) {
        shiftsContainer.innerHTML = '<p>Наразі немає доступних змін.</p>';
      } else {
        globalData.shifts.forEach(shift => {
          const card = document.createElement('div');
          card.className = 'card';
          card.style.border = '1px solid #eee';
          card.innerHTML = `
            <h4>Ресторан "${shift.name}"</h4>
            <p>📍 ${shift.city}</p>
            <p>⏱️ ${shift.time}</p>
            <span class="shift-tag">${shift.pay}</span>
            <button onclick="bookShift('${shift.id}', '${shift.name}')">Забронювати зміну</button>
            ${tgUserId === ADMIN_CHAT_ID ? `<button class="btn-danger" onclick="deleteShift('${shift.id}')">Видалити зміну</button>` : ''}
          `;
          shiftsContainer.appendChild(card);
        });
      }

      myBookingsContainer.innerHTML = '';
      const myBookings = globalData.bookings.filter(b => String(b.userId) === tgUserId);
      if (myBookings.length === 0) {
        myBookingsContainer.innerHTML = '<p>Ви ще не бронювали зміни.</p>';
      } else {
        myBookings.forEach(b => {
          let badgeClass = 'status-pending';
          if (b.status === 'Підтверджено') badgeClass = 'status-confirmed';
          if (b.status === 'Відхилено') badgeClass = 'status-rejected';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h4>${b.shiftName}</h4>
            <p>Статус заявки: <span class="status-badge ${badgeClass}">${b.status}</span></p>
          `;
          myBookingsContainer.appendChild(card);
        });
      }

      if (tgUserId === ADMIN_CHAT_ID) {
        adminBookingsContainer.innerHTML = '';
        if (globalData.bookings.length === 0) {
          adminBookingsContainer.innerHTML = '<p>Поки немає жодної заявки.</p>';
        } else {
          globalData.bookings.forEach(b => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.background = '#fff';
            card.innerHTML = `
              <p><b>Зміна:</b> ${b.shiftName}</p>
              <p>👤 <b>Працівник:</b> ${b.fullName} (${b.username})</p>
              <p>📞 <b>Телефон:</b> ${b.phone}</p>
              <p>Статус: <b>${b.status}</b></p>
              ${b.status === 'Очікує' ? `
                <button class="btn-success" onclick="updateStatus('${b.id}', 'Підтверджено', '${b.userId}', '${b.shiftName}')">Підтвердити</button>
                <button class="btn-danger" onclick="updateStatus('${b.id}', 'Відхилено', '${b.userId}', '${b.shiftName}')">Відхилити</button>
              ` : ''}
            `;
            adminBookingsContainer.appendChild(card);
          });
        }
      }
    }

    async function bookShift(shiftId, shiftName) {
      const savedUser = JSON.parse(localStorage.getItem('kelner_user_' + tgUserId));
      if (!savedUser) return alert('Спочатку заповніть профіль');

      const bookingData = {
        action: 'bookShift',
        id: 'b_' + Date.now(),
        shiftId: shiftId,
        shiftName: shiftName,
        userId: tgUserId,
        fullName: savedUser.fullName,
        phone: savedUser.phone,
        username: savedUser.username
      };

      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(bookingData)
      });

      alert('Заявку надіслано адміністратору!');
      setTimeout(loadData, 1500);
    }

    addShiftForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const shiftData = {
        action: 'addShift',
        id: Date.now(),
        name: document.getElementById('resName').value,
        city: document.getElementById('resCity').value,
        time: document.getElementById('resTime').value,
        pay: document.getElementById('resPay').value
      };

      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(shiftData)
      });

      addShiftForm.reset();
      alert('Зміну додано!');
      setTimeout(loadData, 1500);
    });

    async function deleteShift(id) {
      if (!confirm('Видалити цю зміну?')) return;
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ action: 'deleteShift', id: id })
      });
      setTimeout(loadData, 1500);
    }

    async function updateStatus(bookingId, newStatus, targetUserId, shiftName) {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ action: 'updateStatus', bookingId, newStatus })
      });
      
      if (targetUserId && targetUserId !== 'guest') {
        const msg = newStatus === 'Підтверджено' 
          ? `✅ Вашу заявку на зміну в ресторані "${shiftName}" підтверджено!`
          : `❌ На жаль, вашу заявку на зміну в ресторані "${shiftName}" відхилено.`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: targetUserId, text: msg })
        });
      }

      alert(`Статус змінено на: ${newStatus}`);
      setTimeout(loadData, 1500);
    }
  </script>
</body>
</html>
