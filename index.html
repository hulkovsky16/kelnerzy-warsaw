<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Підробіток Офіціантом</title>
  <!-- Скрипт Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #f4f4f5);
      color: var(--tg-theme-text-color, #222);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2, h3 { margin-top: 0; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background: #fff;
    }
    button {
      width: 100%;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
    }
    .hidden { display: none; }
    .shift-tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- СЕКЦІЯ РЕЄСТРАЦІЇ -->
  <div id="registration-form" class="card">
    <h2>Анкета офіціанта</h2>
    <form id="profileForm">
      <label for="fullName">Ім'я та Прізвище</label>
      <input type="text" id="fullName" placeholder="Олександр Іванов" required>

      <label for="phone">Номер телефону</label>
      <input type="tel" id="phone" placeholder="+48 123 456 789" required>

      <label for="city">Місто</label>
      <select id="city" required>
        <option value="" disabled selected>Оберіть місто</option>
        <option value="Варшава">Варшава</option>
        <option value="Краків">Краків</option>
        <option value="Вроцлав">Вроцлав</option>
        <option value="Гданськ">Гданськ</option>
      </select>

      <button type="submit">Зберегти та дивитися зміни</button>
    </form>
  </div>

  <!-- СЕКЦІЯ ЗМІН (ВІДКРИВАЄТЬСЯ ПІСЛЯ РЕЄСТРАЦІЇ) -->
  <div id="shifts-list" class="card hidden">
    <h3>Доступні підробітки</h3>
    
    <!-- Приклад однієї зміни -->
    <div class="card" style="border: 1px solid #eee;">
      <h4>Ресторан "Grand Cafe"</h4>
      <p>📍 Варшава, центр</p>
      <p>⏱️ Завтра, 14:00 - 22:00 (8 годин)</p>
      <span class="shift-tag">35 злотих/год</span>
      <button onclick="takeShift('Grand Cafe')">Забронювати зміну</button>
    </div>
  </div>

  <script>
    // Ініціалізація Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand(); // Розгортаємо додаток на весь екран

    // Отримуємо username з Telegram
    const tgUser = tg.initDataUnsafe?.user;
    const tgUsername = tgUser ? tgUser.username : 'невідомо';

    const form = document.getElementById('profileForm');
    const regForm = document.getElementById('registration-form');
    const shiftsList = document.getElementById('shifts-list');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const userData = {
        fullName: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value,
        city: document.getElementById('city').value,
        username: tgUsername
      };

      console.log('Дані користувача:', userData);
      
      // Переключаємо екран на список змін
      regForm.classList.add('hidden');
      shiftsList.classList.remove('hidden');
    });

    function takeShift(restaurant) {
      tg.sendData(JSON.stringify({ action: "take_shift", restaurant: restaurant }));
      alert(`Ви відгукнулися на зміну в ${restaurant}!`);
    }
  </script>
</body>
</html>
