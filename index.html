<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alliance works</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#d4a514; --gold-d:#8f6b05; --ink:#2a2412; --bg:#fffdf7; --line:#ecdba6; --soft:#fbf3d9;
      --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px 16px 40px; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    h2,h3,h4 { font-family:var(--serif); margin:0 0 8px; }
    h2 { font-size:30px; } h3 { font-size:25px; } h4 { font-size:21px; }
    p { margin:6px 0; }
    a { color:var(--gold-d); }
    .hidden { display:none !important; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
    .card.admin { border:2px dashed var(--gold); }
    label { display:block; margin-top:10px; font-weight:600; font-size:14px; }
    input, select { width:100%; padding:10px; margin-top:4px; border:1px solid #d8c88f; border-radius:10px;
      font-size:16px; background:#fff; color:var(--ink); }
    input:focus, select:focus, button:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
    .btn { width:100%; margin-top:12px; padding:12px; border:0; border-radius:10px; background:var(--gold);
      color:var(--ink); font-size:16px; font-weight:700; cursor:pointer; }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn.ok { background:#10b981; color:#fff; } .btn.danger { background:#dc2626; color:#fff; }
    .back { background:none; border:0; color:var(--gold-d); font-size:16px; padding:4px 0; margin-bottom:10px; cursor:pointer; }
    .tag, .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; margin-top:6px; }
    .tag { background:var(--soft); color:var(--gold-d); }
    .wait { background:#fef3c7; color:#92400e; } .yes { background:#d1fae5; color:#047857; } .no { background:#fee2e2; color:#b91c1c; }

    .brand { text-align:center; color:var(--gold); padding:8px 0 4px; }
    .brand svg { width:128px; height:128px; }
    .brand .wm { font-family:var(--serif); font-size:48px; font-weight:700; line-height:1; color:var(--gold-d); }
    .brand .sub { font-family:var(--serif); font-size:18px; color:var(--gold-d); }
    .hello { text-align:center; color:#6b6342; margin:10px 0 20px; }
    .menu { display:flex; align-items:center; gap:14px; width:100%; margin-bottom:10px; padding:14px 16px;
      background:#fff; border:1px solid var(--line); border-radius:14px; color:var(--ink); text-align:left; font:inherit; cursor:pointer; }
    .menu:active { background:var(--soft); }
    .menu .mt { flex:1; }
    .menu b { display:block; font-family:var(--serif); font-size:22px; }
    .menu small { color:#6b6342; font-size:13px; }
    .ring { flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:50%;
      border:1.5px solid var(--gold); box-shadow:0 0 0 3px #fff, 0 0 0 4.5px var(--line); }
    .ic { width:22px; height:22px; fill:var(--gold); }
    .chev { color:var(--gold-d); font-size:26px; }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></symbol>
  </svg>

  <div id="msg" class="card">Завантаження…</div>

  <!-- ГОЛОВНЕ МЕНЮ -->
  <section id="v-home" class="view hidden">
    <div class="brand">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="57" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="60" cy="60" r="36" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M60 4L66 54 116 60 66 66 60 116 54 66 4 60 54 54Z" fill="currentColor"/>
        <text x="74" y="30" font-size="9" fill="currentColor" font-family="Georgia,serif" transform="rotate(22 74 30)">2018</text>
      </svg>
      <div class="wm">Alliance</div>
      <div class="sub">works</div>
    </div>
    <p id="hello" class="hello"></p>

    <button class="menu" data-go="shifts">
      <span class="ring"><svg class="ic"><use href="#star"/></svg></span>
      <span class="mt"><b>Доступні підробітки</b><small id="s1"></small></span><span class="chev">›</span>
    </button>
    <button class="menu" id="mn-mine" data-go="mine">
      <span class="ring"><svg class="ic"><use href="#star"/></svg></span>
      <span class="mt"><b>Мої зміни</b><small id="s2"></small></span><span class="chev">›</span>
    </button>
    <button class="menu hidden" id="mn-admin" data-go="admin">
      <span class="ring"><svg class="ic"><use href="#star"/></svg></span>
      <span class="mt"><b>Панель адміністратора</b><small id="s4"></small></span><span class="chev">›</span>
    </button>
    <button class="menu" data-go="contacts">
      <span class="ring"><svg class="ic"><use href="#star"/></svg></span>
      <span class="mt"><b>Зв'язатись з нами</b><small>Адміністратори та телефони</small></span><span class="chev">›</span>
    </button>
  </section>

  <!-- АНКЕТА -->
  <section id="v-reg" class="view hidden">
    <div class="card">
      <h2>Анкета офіціанта</h2>
      <form id="profileForm">
        <label for="fullName">Ім'я та Прізвище</label>
        <input type="text" id="fullName" placeholder="Олександр Іванов" maxlength="80" required>
        <label for="phone">Номер телефону</label>
        <input type="tel" id="phone" placeholder="+48 123 456 789" maxlength="30" required>
        <label for="city">Місто</label>
        <select id="city" required>
          <option value="" disabled selected>Оберіть місто</option>
          <option>Варшава</option><option>Краків</option><option>Вроцлав</option><option>Гданськ</option>
        </select>
        <button type="submit" class="btn">Зберегти та продовжити</button>
      </form>
    </div>
  </section>

  <!-- ДОСТУПНІ ПІДРОБІТКИ -->
  <section id="v-shifts" class="view hidden">
    <button class="back" data-go="home">‹ Меню</button>
    <h3>Доступні підробітки</h3>
    <div id="shifts"></div>
  </section>

  <!-- МОЇ ЗМІНИ -->
  <section id="v-mine" class="view hidden">
    <button class="back" data-go="home">‹ Меню</button>
    <h3>Майбутні зміни</h3>
    <div id="upcoming"></div>
    <h3 style="margin-top:24px">Відпрацьовано цього місяця</h3>
    <div id="done"></div>
  </section>

  <!-- КОНТАКТИ -->
  <section id="v-contacts" class="view hidden">
    <button class="back" data-go="home">‹ Меню</button>
    <h3>Зв'язатись з нами</h3>
    <div id="contacts"></div>
  </section>

  <!-- АДМІН-ПАНЕЛЬ -->
  <section id="v-admin" class="view hidden">
    <button class="back" data-go="home">‹ Меню</button>
    <div class="card admin">
      <h3>Нова зміна</h3>
      <form id="addShiftForm">
        <label>Ресторан</label>
        <input type="text" id="resName" placeholder="Grand Cafe" maxlength="80" required>
        <label>Місто</label>
        <select id="resCity" required>
          <option>Варшава</option><option>Краків</option><option>Вроцлав</option><option>Гданськ</option>
        </select>
        <label>Дата</label>
        <input type="date" id="resDate" required>
        <label>Години</label>
        <input type="text" id="resTime" placeholder="14:00 - 22:00" maxlength="80" required>
        <label>Оплата</label>
        <input type="text" id="resPay" placeholder="35 злотих/год" maxlength="80" required>
        <button type="submit" class="btn">Створити зміну</button>
      </form>
    </div>
    <h3>Заявки працівників</h3>
    <div id="adminBookings"></div>
  </section>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#fffdf7'); tg.setBackgroundColor('#fffdf7'); } catch {}

    const API_URL = "https://script.google.com/macros/s/AKfycbyZ4rDoWnp0BSr4Slz7Axme6V0od1LF9-9RkJqCxjWknf-q3UQB9o5y7W_g69XxPt4y/exec";

    // ✏️ ЗАМІНІТЬ на реальні контакти адміністраторів
    const CONTACTS = [
      { name: 'Адміністратор', username: '@username1', phone: '+48 000 000 000' },
      { name: 'Адміністратор', username: '@username2', phone: '+48 000 000 001' }
    ];

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const LS_KEY = 'kelner_user_' + (tg.initDataUnsafe?.user?.id ?? 'guest');
    const profile = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch { return null; } };
    const statusCls = s => ({ 'Підтверджено': 'yes', 'Відхилено': 'no' }[s] || 'wait');
    const pad = n => String(n).padStart(2, '0');
    const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
    const fmtDate = s => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return '';
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('uk-UA', { weekday: 'short', day: 'numeric', month: 'long' });
    };
    const when = (d, t) => [fmtDate(d), t].filter(Boolean).join(' · ');
    const byDate = (k, dir = 1) => (a, b) => dir * String(a[k] || '9999').localeCompare(String(b[k] || '9999'));

    let state = { role: null, shifts: [], bookings: [] };
    let busy = false, ready = false;

    async function api(action, payload = {}) {
      const qs = new URLSearchParams({ action, auth: tg.initData, p: JSON.stringify(payload) });
      const res = await fetch(API_URL + '?' + qs);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      return json;
    }

    async function load() {
      try {
        state = await api('getData');
        if (!ready) { ready = true; go(state.role !== 'admin' && !profile() ? 'reg' : 'home'); }
        else render();
      } catch (e) {
        console.error(e);
        if (!ready) { $('msg').textContent = '⚠️ ' + e.message; $('msg').classList.remove('hidden'); }
      }
    }

    function go(v) {
      $('msg').classList.add('hidden');
      document.querySelectorAll('.view').forEach(x => x.classList.toggle('hidden', x.id !== 'v-' + v));
      if (v === 'home' || v === 'reg') tg.BackButton?.hide(); else tg.BackButton?.show();
      render();
      window.scrollTo(0, 0);
    }
    tg.BackButton?.onClick(() => go('home'));

    function mineSplit() {
      const t = today(), ok = state.bookings.filter(b => b.status !== 'Відхилено');
      return {
        up: ok.filter(b => !b.shiftDate || b.shiftDate >= t).sort(byDate('shiftDate')),
        done: ok.filter(b => b.status === 'Підтверджено' && b.shiftDate && b.shiftDate < t
          && b.shiftDate.slice(0, 7) === t.slice(0, 7)).sort(byDate('shiftDate', -1))
      };
    }

    const myCard = b => `
      <div class="card">
        <h4>${esc(b.shiftName)}</h4>
        <p>🗓 ${esc(when(b.shiftDate, b.shiftTime) || 'Дату уточнюйте')}</p>
        <span class="badge ${statusCls(b.status)}">${esc(b.status)}</span>
      </div>`;

    function render() {
      if (!state.role) return;
      const admin = state.role === 'admin', t = today();
      $('mn-mine').classList.toggle('hidden', admin);
      $('mn-admin').classList.toggle('hidden', !admin);
      const name = tg.initDataUnsafe?.user?.first_name;
      $('hello').textContent = name ? `Вітаємо, ${name}!` : 'Вітаємо!';

      // Каталог: лише актуальні (майбутні) зміни
      const taken = new Set(state.bookings.filter(b => b.status !== 'Відхилено').map(b => b.shiftId));
      const open = state.shifts.filter(s => !s.date || s.date >= t).sort(byDate('date'));
      $('s1').textContent = `Актуальних пропозицій: ${open.length}`;
      $('shifts').innerHTML = open.length ? open.map(s => `
        <div class="card">
          <h4>${esc(s.name)}</h4>
          <p>📍 ${esc(s.city)}</p>
          <p>🗓 ${esc(when(s.date, s.time) || 'Дату уточнюйте')}</p>
          <span class="tag">${esc(s.pay)}</span>
          ${admin ? `<button class="btn danger" data-act="del" data-id="${esc(s.id)}">Видалити зміну</button>`
            : taken.has(s.id) ? `<button class="btn" disabled>Заявку подано</button>`
            : `<button class="btn" data-act="book" data-id="${esc(s.id)}">Забронювати зміну</button>`}
        </div>`).join('') : '<p>Наразі немає доступних змін.</p>';

      if (admin) {
        $('s4').textContent = `Заявок на розгляді: ${state.bookings.filter(b => b.status === 'Очікує').length}`;
        $('adminBookings').innerHTML = state.bookings.length ? state.bookings.slice().reverse().map(b => `
          <div class="card">
            <p><b>Зміна:</b> ${esc(b.shiftName)}${b.shiftDate ? ' — ' + esc(when(b.shiftDate, b.shiftTime)) : ''}</p>
            <p>👤 <b>Працівник:</b> ${esc(b.fullName)} (${esc(b.username)})</p>
            <p>📞 <b>Телефон:</b> ${esc(b.phone)}</p>
            <p>Статус: <span class="badge ${statusCls(b.status)}">${esc(b.status)}</span></p>
            ${b.status === 'Очікує' ? `
              <button class="btn ok" data-act="st" data-id="${esc(b.id)}" data-s="Підтверджено">Підтвердити</button>
              <button class="btn danger" data-act="st" data-id="${esc(b.id)}" data-s="Відхилено">Відхилити</button>` : ''}
          </div>`).join('') : '<p>Поки немає жодної заявки.</p>';
      } else {
        const { up, done } = mineSplit();
        $('s2').textContent = `Майбутніх: ${up.length} · Відпрацьовано за місяць: ${done.length}`;
        $('upcoming').innerHTML = up.length ? up.map(myCard).join('') : '<p>Майбутніх змін поки немає.</p>';
        $('done').innerHTML = done.length ? done.map(myCard).join('') : '<p>Цього місяця відпрацьованих змін ще немає.</p>';
      }
    }

    $('contacts').innerHTML = CONTACTS.map(c => `
      <div class="card">
        <h4>${esc(c.name)}</h4>
        <p>✈️ ${esc(c.username)}</p>
        <p>📞 <a href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">${esc(c.phone)}</a></p>
        <button class="btn" data-act="tg" data-u="${esc(c.username.replace('@', ''))}">Написати в Telegram</button>
      </div>`).join('');

    $('resDate').min = today();

    $('profileForm').addEventListener('submit', e => {
      e.preventDefault();
      localStorage.setItem(LS_KEY, JSON.stringify({
        fullName: $('fullName').value.trim(), phone: $('phone').value.trim(), city: $('city').value
      }));
      try { tg.requestWriteAccess && tg.requestWriteAccess(); } catch {}
      go('home');
    });

    $('addShiftForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        state = await api('addShift', {
          name: $('resName').value, city: $('resCity').value, date: $('resDate').value,
          time: $('resTime').value, pay: $('resPay').value
        });
        e.target.reset();
        render();
        alert('Зміну додано!');
      } catch (err) { alert('Помилка: ' + err.message); }
      finally { busy = false; }
    });

    document.addEventListener('click', async e => {
      const nav = e.target.closest('[data-go]');
      if (nav) return go(nav.dataset.go);
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const { act, id, s, u } = btn.dataset;
      if (act === 'tg') return tg.openTelegramLink('https://t.me/' + u);
      if (busy) return;
      busy = true;
      btn.disabled = true;
      try {
        if (act === 'book') {
          const p = profile();
          if (!p) throw new Error('Спочатку заповніть анкету');
          state = await api('bookShift', { shiftId: id, fullName: p.fullName, phone: p.phone });
          render();
          alert('Заявку надіслано адміністратору!');
        } else if (act === 'del') {
          if (confirm('Видалити цю зміну?')) { state = await api('deleteShift', { id }); render(); }
        } else if (act === 'st') {
          state = await api('updateStatus', { id, status: s });
          render();
          alert(state.notified ? `Статус: ${s}. Працівника сповіщено.`
            : `Статус: ${s}. ⚠️ Сповіщення не доставлено — працівник ще не запускав бота (/start).`);
        }
      } catch (err) { alert('Помилка: ' + err.message); load(); }
      finally { busy = false; btn.disabled = false; }
    });

    setInterval(() => { if (!document.hidden && !busy && ready) load(); }, 15000);

    if (!tg.initData) { $('msg').textContent = '⚠️ Відкрийте додаток через Telegram-бота.'; }
    else load();
  </script>
</body>
</html>
